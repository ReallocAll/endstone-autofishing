name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-suffix: ${{ github.job }}-py${{ matrix.python-version }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --group dev
      - run: uv run --no-sync ruff check src tests/test_regressions.py
      - run: uv run --no-sync pytest -q

  build:
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-suffix: ${{ github.job }}-py${{ matrix.python-version }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --group dev
      - run: uv build
      - name: Validate built wheel and isolated installation
        shell: bash
        run: |
          set -euo pipefail
          uv venv /tmp/autofishing-wheel-check
          uv pip install --python /tmp/autofishing-wheel-check/bin/python --no-deps dist/*.whl
          /tmp/autofishing-wheel-check/bin/python - <<'PY'
          from importlib.metadata import distribution
          from pathlib import Path
          import zipfile

          d = distribution("endstone-autofishing")
          assert d.version == "0.4.0"
          eps = [ep for ep in d.entry_points if ep.group == "endstone"]
          assert len(eps) == 1
          assert eps[0].name == "autofishing"
          assert eps[0].value == "endstone_autofishing:AutoFishingPlugin"
          root = Path("dist")
          wheels = list(root.glob("*.whl"))
          assert len(wheels) == 1
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              for path in ["endstone_autofishing/__init__.py", "endstone_autofishing/plugin.py", "endstone_autofishing/protocol.py", "endstone_autofishing/config.toml"]:
                  assert path in names, path
              assert any(path.endswith("/licenses/LICENSE") for path in names)
          print("wheel installation, entry point and package contents: OK")
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: autofishing-build-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error

